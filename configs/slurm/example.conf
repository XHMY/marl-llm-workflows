# Template for another cluster. Copy it, set the META lines and the #SBATCH lines, and pass it with
# --slurm-config. META lines are read by scripts/launch.py:
#   GPU_TYPE           H100, H200 or L40S: selects the per-GPU token budget and the GPU check
#   CPUS_PER_GPU_MATH  CPU cores per GPU for Math jobs
#   MEM_PER_GPU_MATH   host memory per GPU for Math jobs
#   CPUS_PER_GPU_CODE  CPU cores per GPU for code jobs (the code-execution pool uses all of them)
#   MEM_PER_GPU_CODE   host memory per GPU for code jobs
# The launcher writes --job-name, --output, --error, --gres, --cpus-per-gpu and --mem-per-gpu itself;
# such lines here are ignored.
# META: GPU_TYPE=H100
# META: CPUS_PER_GPU_MATH=8
# META: MEM_PER_GPU_MATH=64G
# META: CPUS_PER_GPU_CODE=16
# META: MEM_PER_GPU_CODE=80G
#SBATCH --partition=gpu
#SBATCH --nodes=1
#SBATCH --time=1-00:00:00
