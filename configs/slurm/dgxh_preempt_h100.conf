# META: GPU_TYPE=H100
# META: CPUS_PER_GPU_MATH=8
# META: MEM_PER_GPU_MATH=64G
# META: CPUS_PER_GPU_CODE=16
# META: MEM_PER_GPU_CODE=80G
# Recommended for training at every scale: 80 GB GPUs only (H100 or H200) on the dgxh or preempt
# partitions. dgxh-1 is excluded because its H100s have 40 GB. Segments of at most 5 h 50 min fit
# the dgxh limit; chain them with `scripts/launch.py --chain K` (each segment resumes).
#SBATCH --partition=dgxh,preempt
#SBATCH --account=eecs
#SBATCH --nodes=1
#SBATCH --time=1-00:00:00
#SBATCH --constraint=h100|h200
#SBATCH --exclude=dgxh-1
#SBATCH --requeue
