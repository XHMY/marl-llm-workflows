# META: GPU_TYPE=L40S
# META: CPUS_PER_GPU_MATH=8
# META: MEM_PER_GPU_MATH=48G
# META: CPUS_PER_GPU_CODE=16
# META: MEM_PER_GPU_CODE=64G
# 48 GB L40S pairs: 0.6B and 1.7B only. 4B runs out of memory in the actor update on 48 GB GPUs,
# and the launcher refuses 4B here (it also never uses A40 or RTX8000 for training).
#SBATCH --partition=preempt
#SBATCH --nodes=1
#SBATCH --time=7-00:00:00
#SBATCH --constraint=l40s
#SBATCH --requeue
